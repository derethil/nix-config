name: Merge Renovate hash updates

on:
  workflow_run:
    workflows:
      - CI
      - Build and populate cache
    types:
      - completed

jobs:
  enable:
    name: Merge after hash regeneration
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      startsWith(github.event.workflow_run.head_branch, 'renovate/')
    runs-on: ubuntu-latest

    steps:
      - name: Merge hash-updated PRs
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN_FOR_FLAKE_UPDATE }}
          PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
        run: |
          set -euo pipefail

          if [[ -z "${PR_NUMBER}" ]]; then
            echo "Workflow run is not associated with a pull request"
            exit 0
          fi

          if ! gh pr view "${PR_NUMBER}" --json labels --jq '.labels[].name' | grep -qx hash-updated; then
            echo "PR does not have the hash-updated label"
            exit 0
          fi

          if ! gh pr checks "${PR_NUMBER}" --required >/dev/null; then
            echo "Required checks have not all passed"
            exit 0
          fi

          gh pr merge "${PR_NUMBER}" --squash
