name: CI

on:
  push:
    branches:
      - main
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - labeled
  workflow_dispatch:

jobs:
  lint:
    name: Lint expressions
    if: >-
      !contains(github.event.pull_request.body || '', '<!-- nix-source-hash-update -->') ||
      (github.event.action == 'labeled' && github.event.label.name == 'hash-updated')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          install_url: https://nixos.org/nix/install
          extra_nix_config: |
            auto-optimise-store = true
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}
            experimental-features = nix-command flakes

      - name: Install lint tools
        run: nix profile install nixpkgs#just nixpkgs#fd nixpkgs#statix nixpkgs#deadnix github:Swarsel/pedantix#pedantix-wrapped

      - name: Lint
        run: just lint check

  validate:
    name: Check expressions
    if: >-
      !contains(github.event.pull_request.body || '', '<!-- nix-source-hash-update -->') ||
      (github.event.action == 'labeled' && github.event.label.name == 'hash-updated')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up SSH for nix-secrets repository access
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.NIX_SECRETS_SSH_KEY }}

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          install_url: https://nixos.org/nix/install
          extra_nix_config: |
            auto-optimise-store = true
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}
            experimental-features = nix-command flakes

      - name: Validate flake
        run: nix flake check --all-systems

      - name: Check flake health
        uses: DeterminateSystems/flake-checker-action@v14
        with:
          ignore-missing-flake-lock: false
          fail-mode: true
