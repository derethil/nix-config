name: CI

on:
  push:
    branches:
      - main
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - labeled
  workflow_dispatch:

jobs:
  lint:
    name: Lint expressions
    if: >-
      (!contains(github.event.pull_request.body || '', '<!-- nix-source-hash-update -->') ||
      (github.event.action == 'labeled' && github.event.label.name == 'hash-updated')) &&
      !(github.event.pull_request.user.login == 'renovate[bot]' &&
      contains(github.event.pull_request.body || '', '<!-- homelab-container-update -->'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Nix
        uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # v31
        with:
          install_url: https://nixos.org/nix/install
          extra_nix_config: |
            auto-optimise-store = true
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}
            experimental-features = nix-command flakes

      - name: Install lint tools
        run: nix profile install nixpkgs#just nixpkgs#fd nixpkgs#statix nixpkgs#deadnix github:Swarsel/pedantix#pedantix-wrapped

      - name: Lint
        run: just lint check

  validate:
    name: Check expressions
    if: >-
      !contains(github.event.pull_request.body || '', '<!-- nix-source-hash-update -->') ||
      (github.event.action == 'labeled' && github.event.label.name == 'hash-updated')
    runs-on: ubuntu-latest
    steps:
      - name: Skip flake validation for container metadata
        if: >-
          github.event.pull_request.user.login == 'renovate[bot]' &&
          contains(github.event.pull_request.body || '', '<!-- homelab-container-update -->')
        run: echo "Container image metadata does not affect flake evaluation"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: >-
          github.event.pull_request.user.login != 'renovate[bot]' ||
          !contains(github.event.pull_request.body || '', '<!-- homelab-container-update -->')

      - name: Set up SSH for nix-secrets repository access
        if: >-
          github.event.pull_request.user.login != 'renovate[bot]' ||
          !contains(github.event.pull_request.body || '', '<!-- homelab-container-update -->')
        uses: webfactory/ssh-agent@e83874834305fe9a4a2997156cb26c5de65a8555 # v0.10.0
        with:
          ssh-private-key: ${{ secrets.NIX_SECRETS_SSH_KEY }}

      - name: Install Nix
        if: >-
          github.event.pull_request.user.login != 'renovate[bot]' ||
          !contains(github.event.pull_request.body || '', '<!-- homelab-container-update -->')
        uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # v31
        with:
          install_url: https://nixos.org/nix/install
          extra_nix_config: |
            auto-optimise-store = true
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}
            experimental-features = nix-command flakes

      - name: Validate flake
        if: >-
          github.event.pull_request.user.login != 'renovate[bot]' ||
          !contains(github.event.pull_request.body || '', '<!-- homelab-container-update -->')
        run: nix flake check --all-systems

      - name: Check flake health
        if: >-
          github.event.pull_request.user.login != 'renovate[bot]' ||
          !contains(github.event.pull_request.body || '', '<!-- homelab-container-update -->')
        uses: DeterminateSystems/flake-checker-action@786422608c7bded2bbc9741ad9f91356842bf520 # v14
        with:
          ignore-missing-flake-lock: false
          fail-mode: true
