name: Regenerate Renovate hashes

on:
  pull_request:
    types:
      - opened
      - synchronize
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regenerate:
    name: Regenerate Nix source hashes
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.actor == 'renovate[bot]' &&
      contains(github.event.pull_request.body || '', '<!-- nix-source-hash-update -->'))
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Mark hashes as pending
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN_FOR_FLAKE_UPDATE }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          gh api --method DELETE \
            "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/labels/hash-updated" \
            --silent || true
          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/labels" \
            -f 'labels[]=needs-hash-update' \
            --silent

      - name: Checkout Renovate branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          token: ${{ secrets.GH_TOKEN_FOR_FLAKE_UPDATE }}

      - name: Set up SSH for nix-secrets repository access
        uses: webfactory/ssh-agent@e83874834305fe9a4a2997156cb26c5de65a8555 # v0.10.0
        with:
          ssh-private-key: ${{ secrets.NIX_SECRETS_SSH_KEY }}

      - name: Initialize submodules
        run: git submodule update --init --recursive

      - name: Install Nix
        uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # v31
        with:
          github_access_token: ${{ github.token }}

      - name: Regenerate hashes changed by Renovate
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref || github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          mapfile -t changed < <(
            git diff --name-only \
              "origin/${BASE_REF}...HEAD" -- '*.nix'
          )

          if [[ ${#changed[@]} -eq 0 ]]; then
            echo "Branch touches no Nix files"
            exit 0
          fi

          printf 'Scanning %s\n' "${changed[@]}"
          nix run nixpkgs#just -- renovate regen-nix-hashes "${changed[@]}"

      - name: Push regenerated hashes as a fixup
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref || github.ref_name }}
        run: |
          set -euo pipefail

          if git diff --quiet; then
            echo "Nix source hashes are already current"
            exit 0
          fi

          git --no-pager diff
          subject="$(git log -1 --format=%s)"
          git config user.name "renovate hash regen"
          git config user.email "renovate-hash-regen@users.noreply.github.com"
          git commit --all --message "fixup! ${subject}"
          git push origin "HEAD:${HEAD_REF}"

      - name: Mark hashes as updated
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN_FOR_FLAKE_UPDATE }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          gh api --method DELETE \
            "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/labels/needs-hash-update" \
            --silent || true
          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/labels" \
            -f 'labels[]=hash-updated' \
            --silent
